<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>ONLY YES</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f3;
      color: #111;
    }
    .app {
      width: min(680px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 34px 18px 24px;
      display: flex;
      flex-direction: column;
    }
    header { text-align: center; margin-bottom: 24px; }
    h1 { margin: 0; font-size: clamp(34px, 10vw, 56px); letter-spacing: -2px; }
    .challenge { margin: 10px auto 0; max-width: 440px; line-height: 1.45; font-size: 16px; }
    .challenge strong { font-weight: 800; }
    #messages {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 8px 0 22px;
    }
    .message {
      max-width: 86%;
      padding: 12px 14px;
      border-radius: 18px;
      line-height: 1.35;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .user { align-self: flex-end; background: #111; color: white; border-bottom-right-radius: 5px; }
    .assistant { align-self: flex-start; background: white; border: 1px solid #ddd; border-bottom-left-radius: 5px; font-weight: 700; }
    .status { align-self: center; font-size: 13px; color: #666; }
    form {
      position: sticky;
      bottom: 0;
      padding-top: 12px;
      padding-bottom: max(0px, env(safe-area-inset-bottom));
      background: linear-gradient(to bottom, rgba(245,245,243,0), #f5f5f3 18%);
    }
    .input-row { display: flex; gap: 8px; align-items: flex-end; }
    textarea {
      flex: 1;
      resize: none;
      min-height: 52px;
      max-height: 140px;
      border: 1px solid #bbb;
      border-radius: 16px;
      padding: 14px;
      font: inherit;
      background: white;
    }
    button {
      border: 0;
      border-radius: 14px;
      padding: 15px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    #send { background: #111; color: white; min-height: 52px; }
    #send:disabled { opacity: .45; cursor: default; }
    .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 9px; }
    #reset { background: transparent; padding: 7px 2px; color: #555; font-size: 14px; }
    #count { color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>ONLY YES</h1>
      <p class="challenge">This chatbot has one rule: <strong>it can only say YES.</strong><br>Can you get it to say anything else?</p>
    </header>

    <section id="messages" aria-live="polite"></section>

    <form id="chat-form">
      <div class="input-row">
        <textarea id="input" maxlength="2000" placeholder="Type anything…" aria-label="Message" required></textarea>
        <button id="send" type="submit">Send</button>
      </div>
      <div class="controls">
        <button id="reset" type="button">Reset conversation</button>
        <span id="count">0 / 10 messages</span>
      </div>
    </form>
  </main>

<script>
  const form = document.getElementById("chat-form");
  const input = document.getElementById("input");
  const messagesEl = document.getElementById("messages");
  const send = document.getElementById("send");
  const reset = document.getElementById("reset");
  const count = document.getElementById("count");

  let messages = [];
  const MAX_TURNS = 10;

  function renderMessage(role, text, extraClass = "") {
    const div = document.createElement("div");
    div.className = extraClass || `message ${role}`;
    div.textContent = text;
    messagesEl.appendChild(div);
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    return div;
  }

  function updateCount() {
    const turns = messages.filter(m => m.role === "user").length;
    count.textContent = `${turns} / ${MAX_TURNS} messages`;
    send.disabled = turns >= MAX_TURNS;
    input.disabled = turns >= MAX_TURNS;
    if (turns >= MAX_TURNS && !document.getElementById("limit-note")) {
      const note = renderMessage("", "10-message limit reached. Reset to try again.", "status");
      note.id = "limit-note";
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    const turns = messages.filter(m => m.role === "user").length;
    if (!text || turns >= MAX_TURNS) return;

    messages.push({ role: "user", content: text });
    renderMessage("user", text);
    input.value = "";
    send.disabled = true;

    const waiting = renderMessage("", "Thinking…", "status");

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages })
      });

      const data = await response.json();
      waiting.remove();

      if (!response.ok) throw new Error(data.error || "Request failed.");

      const reply = data.reply;
      messages.push({ role: "assistant", content: reply });
      renderMessage("assistant", reply);
    } catch (err) {
      waiting.textContent = "Something went wrong. Please try again.";
      messages.pop();
    } finally {
      updateCount();
      if (!input.disabled) send.disabled = false;
      input.focus();
    }
  });

  reset.addEventListener("click", () => {
    messages = [];
    messagesEl.innerHTML = "";
    input.disabled = false;
    send.disabled = false;
    input.value = "";
    updateCount();
    input.focus();
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  updateCount();
</script>
</body>
</html>
